services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: seguria-homeassistant
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro

  mqtt:
    image: eclipse-mosquitto:2
    container_name: seguria-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - ./mosquitto-data:/mosquitto/data
      - ./mosquitto-log:/mosquitto/log

  seguria-gateway:
    image: ghcr.io/traviscomber/seguria-gateway:latest
    build:
      context: https://github.com/traviscomber/v0-seguria-website.git#main:gateway
    container_name: seguria-gateway
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./gateway-data:/app/data
    depends_on:
      - mqtt
