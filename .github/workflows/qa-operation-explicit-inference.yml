name: QA operation-explicit inference codemod

on:
  push:
    branches:
      - feature/huilo-huilo-wildlife-preservation
    paths:
      - .github/workflows/qa-operation-explicit-inference.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/huilo-huilo-wildlife-preservation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply operation-explicit Vision contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          route_path = Path('app/api/vision/openai/infer/route.ts')
          route = route_path.read_text()

          route = replace_once(route,
              "const MAX_RETRIES = 2\n",
              "const MAX_RETRIES = 2\nconst SCOPE_CONFLICT = '__scope_conflict__'\n",
              'scope constant')

          operation_context = '''async function resolveOperationContext(\n  auth: NonNullable<Awaited<ReturnType<typeof getAuthorizedRequest>>>,\n  rawOperationId: string | null,\n) {\n  const parsed = z.string().uuid().safeParse(rawOperationId)\n  if (!parsed.success) {\n    return { ok: false as const, status: 400, error: 'operation_required', message: 'x-operation-id must be a valid operation UUID.' }\n  }\n\n  const operationId = parsed.data\n  if (auth.user.role !== 'admin' && !auth.user.operationIds.includes(operationId)) {\n    return { ok: false as const, status: 403, error: 'operation_forbidden', message: 'No autorizado para esta operacion.' }\n  }\n\n  const supabase = createSupabaseAdminClient()\n  if (!supabase) {\n    return { ok: false as const, status: 503, error: 'database_not_configured', message: 'Base de datos no configurada.' }\n  }\n\n  const { data: property, error: propertyError } = await supabase\n    .from('properties')\n    .select('id,organization_id,operation_id')\n    .eq('operation_id', operationId)\n    .maybeSingle()\n\n  if (propertyError) {\n    console.error('Vision operation property lookup failed:', propertyError.message)\n    return { ok: false as const, status: 500, error: 'operation_lookup_failed', message: 'No fue posible resolver la operacion.' }\n  }\n  if (!property) {\n    return { ok: false as const, status: 422, error: 'operation_unlinked', message: 'La operacion no esta vinculada a una propiedad canonica.' }\n  }\n\n  if (auth.user.role !== 'admin') {\n    const { data: link, error: linkError } = await supabase\n      .from('user_operations')\n      .select('role')\n      .eq('user_id', auth.user.id)\n      .eq('operation_id', operationId)\n      .maybeSingle()\n\n    if (linkError) {\n      console.error('Vision operation authorization lookup failed:', linkError.message)\n      return { ok: false as const, status: 500, error: 'operation_access_lookup_failed', message: 'No fue posible validar el acceso a la operacion.' }\n    }\n    if (!link || !['owner', 'admin', 'operator'].includes(link.role || '')) {\n      return { ok: false as const, status: 403, error: 'operation_forbidden', message: 'El rol de la operacion no permite inferencia directa.' }\n    }\n  }\n\n  return {\n    ok: true as const,\n    operationId,\n    propertyId: property.id as string,\n    organizationId: property.organization_id as string,\n  }\n}\n\n'''
          route = replace_once(route, 'async function enforceQuota(userId: string, organizationId: string | null) {', operation_context + 'async function enforceQuota(userId: string, organizationId: string | null) {', 'operation context')

          old_camera = '''async function resolveCamera(input: { userId: string; organizationId: string | null; code: string | null; name: string | null; zoneLabel: string | null }) {\n  if (!input.code) return null\n  const supabase = createSupabaseAdminClient()\n  if (!supabase) return null\n  const { data, error } = await supabase.from('wildlife_cameras').upsert({\n    organization_id: input.organizationId,\n    created_by_user_id: input.userId,\n    code: input.code,\n    name: input.name || input.code,\n    zone_label: input.zoneLabel,\n    updated_at: new Date().toISOString(),\n  }, { onConflict: 'created_by_user_id,code' }).select('id').single()\n  if (error) {\n    console.error('Wildlife camera resolution failed:', error.message)\n    return null\n  }\n  return data.id as string\n}\n'''
          new_camera = '''async function resolveCamera(input: { userId: string; operationId: string; organizationId: string; code: string | null; name: string | null; zoneLabel: string | null }) {\n  if (!input.code) return null\n  const supabase = createSupabaseAdminClient()\n  if (!supabase) return null\n\n  const { data: scopedCamera, error: scopedError } = await supabase\n    .from('wildlife_cameras')\n    .select('id,operation_id')\n    .eq('operation_id', input.operationId)\n    .eq('code', input.code)\n    .maybeSingle()\n  if (scopedError) {\n    console.error('Wildlife camera scope lookup failed:', scopedError.message)\n    return null\n  }\n\n  if (scopedCamera) {\n    const { data, error } = await supabase\n      .from('wildlife_cameras')\n      .update({ name: input.name || input.code, zone_label: input.zoneLabel, updated_at: new Date().toISOString() })\n      .eq('id', scopedCamera.id)\n      .select('id')\n      .single()\n    if (error) {\n      console.error('Wildlife camera update failed:', error.message)\n      return null\n    }\n    return data.id as string\n  }\n\n  const { data: legacyCollision, error: collisionError } = await supabase\n    .from('wildlife_cameras')\n    .select('id,operation_id')\n    .eq('created_by_user_id', input.userId)\n    .eq('code', input.code)\n    .maybeSingle()\n  if (collisionError) {\n    console.error('Wildlife camera collision lookup failed:', collisionError.message)\n    return null\n  }\n  if (legacyCollision) {\n    console.error('Wildlife camera scope conflict:', legacyCollision.id)\n    return SCOPE_CONFLICT\n  }\n\n  const { data, error } = await supabase.from('wildlife_cameras').insert({\n    operation_id: input.operationId,\n    organization_id: input.organizationId,\n    created_by_user_id: input.userId,\n    code: input.code,\n    name: input.name || input.code,\n    zone_label: input.zoneLabel,\n  }).select('id').single()\n  if (error) {\n    console.error('Wildlife camera creation failed:', error.message)\n    return null\n  }\n  return data.id as string\n}\n'''
          route = replace_once(route, old_camera, new_camera, 'resolveCamera')

          old_evidence = '''async function storeEvidence(input: { userId: string; sha256: string; mimeType: string; image: Buffer }) {\n  const supabase = createSupabaseAdminClient()\n  if (!supabase) return null\n  const storagePath = `${input.userId}/${input.sha256}.${EXTENSIONS[input.mimeType]}`\n'''
          new_evidence = '''async function storeEvidence(input: { userId: string; operationId: string; sha256: string; mimeType: string; image: Buffer }) {\n  const supabase = createSupabaseAdminClient()\n  if (!supabase) return null\n  const storagePath = `${input.operationId}/${input.userId}/${input.sha256}.${EXTENSIONS[input.mimeType]}`\n'''
          route = replace_once(route, old_evidence, new_evidence, 'storeEvidence')

          old_persist_start = '''async function persistJob(input: {\n  userId: string\n  organizationId: string | null\n'''
          new_persist_start = '''async function persistJob(input: {\n  userId: string\n  operationId: string\n  organizationId: string\n'''
          route = replace_once(route, old_persist_start, new_persist_start, 'persist signature')

          old_persist_body_start = '''  const supabase = createSupabaseAdminClient()\n  if (!supabase) return null\n  const { data, error } = await supabase.from('wildlife_inference_jobs').upsert({\n    submitted_by_user_id: input.userId,\n    organization_id: input.organizationId,\n'''
          new_persist_body_start = '''  const supabase = createSupabaseAdminClient()\n  if (!supabase) return null\n\n  const { data: existing, error: lookupError } = await supabase\n    .from('wildlife_inference_jobs')\n    .select('id,operation_id')\n    .eq('submitted_by_user_id', input.userId)\n    .eq('sha256', input.sha256)\n    .eq('model_name', input.model)\n    .maybeSingle()\n  if (lookupError) {\n    console.error('Wildlife inference idempotency lookup failed:', lookupError.message)\n    return null\n  }\n  if (existing && existing.operation_id !== input.operationId) {\n    console.error('Wildlife inference scope conflict:', existing.id)\n    return SCOPE_CONFLICT\n  }\n\n  const payload = {\n    submitted_by_user_id: input.userId,\n    operation_id: input.operationId,\n    organization_id: input.organizationId,\n'''
          route = replace_once(route, old_persist_body_start, new_persist_body_start, 'persist lookup')

          old_persist_end = '''    error_message: input.errorMessage ?? null,\n    updated_at: new Date().toISOString(),\n  }, { onConflict: 'submitted_by_user_id,sha256,model_name' }).select('id').single()\n  if (error) {\n    console.error('Wildlife inference persistence failed:', error.message)\n    return null\n  }\n  return data.id as string\n}\n'''
          new_persist_end = '''    error_message: input.errorMessage ?? null,\n    updated_at: new Date().toISOString(),\n  }\n\n  const result = existing\n    ? await supabase.from('wildlife_inference_jobs').update(payload).eq('id', existing.id).select('id').single()\n    : await supabase.from('wildlife_inference_jobs').insert(payload).select('id').single()\n  if (result.error) {\n    console.error('Wildlife inference persistence failed:', result.error.message)\n    return null\n  }\n  return result.data.id as string\n}\n'''
          route = replace_once(route, old_persist_end, new_persist_end, 'persist write')

          old_org = '''  const organizationId = auth.user.organizationIds[0] ?? null\n  const quota = await enforceQuota(auth.user.id, organizationId)\n'''
          new_org = '''  const operationContext = await resolveOperationContext(auth, safeHeader(request, 'x-operation-id', 64))\n  if (!operationContext.ok) {\n    return NextResponse.json({ error: operationContext.error, message: operationContext.message }, { status: operationContext.status })\n  }\n  const { operationId, organizationId } = operationContext\n  const quota = await enforceQuota(auth.user.id, organizationId)\n'''
          route = replace_once(route, old_org, new_org, 'POST operation context')

          route = replace_once(route,
            "  const cameraId = await resolveCamera({ userId: auth.user.id, organizationId, code: cameraCode, name: cameraName, zoneLabel })\n  const evidence = await storeEvidence({ userId: auth.user.id, sha256, mimeType: contentType, image })\n",
            "  const cameraId = await resolveCamera({ userId: auth.user.id, operationId, organizationId, code: cameraCode, name: cameraName, zoneLabel })\n  if (cameraId === SCOPE_CONFLICT) return NextResponse.json({ error: 'camera_scope_conflict', message: 'El codigo de camara ya existe en otro scope.' }, { status: 409 })\n  const evidence = await storeEvidence({ userId: auth.user.id, operationId, sha256, mimeType: contentType, image })\n",
            'camera and evidence call')

          route = route.replace('userId: auth.user.id, organizationId, filename, mimeType: contentType,', 'userId: auth.user.id, operationId, organizationId, filename, mimeType: contentType,')
          if route.count('userId: auth.user.id, operationId, organizationId, filename, mimeType: contentType,') != 2:
              raise SystemExit('persist call operationId: expected 2 updated calls')

          route = replace_once(route,
            "    return NextResponse.json({ error: 'openai_request_failed', message, job_id: jobId, model_version: model }, { status: 502 })\n",
            "    if (jobId === SCOPE_CONFLICT) return NextResponse.json({ error: 'inference_scope_conflict', message: 'La misma evidencia ya existe en otra operacion.' }, { status: 409 })\n    return NextResponse.json({ error: 'openai_request_failed', message, job_id: jobId, model_version: model }, { status: 502 })\n",
            'failed persistence conflict')

          route = replace_once(route,
            "  if (!jobId) return NextResponse.json({ error: 'job_persistence_failed', message: 'La imagen fue analizada, pero no fue posible guardar el trabajo.' }, { status: 503 })\n",
            "  if (jobId === SCOPE_CONFLICT) return NextResponse.json({ error: 'inference_scope_conflict', message: 'La misma evidencia ya existe en otra operacion.' }, { status: 409 })\n  if (!jobId) return NextResponse.json({ error: 'job_persistence_failed', message: 'La imagen fue analizada, pero no fue posible guardar el trabajo.' }, { status: 503 })\n",
            'completed persistence conflict')

          route = replace_once(route,
            "    quota: { limit: quota.limit, used_before_request: quota.used },\n",
            "    operation_id: operationId,\n    organization_id: organizationId,\n    quota: { limit: quota.limit, used_before_request: quota.used },\n",
            'response scope')
          route_path.write_text(route)

          projects_path = Path('app/admin/proyectos/page.tsx')
          projects = projects_path.read_text()
          projects = replace_once(projects, "  organization_id: string\n  name: string\n", "  organization_id: string\n  operation_id: string | null\n  name: string\n", 'property operation type')
          projects = replace_once(projects, "  organization_id: string | null\n  name: string\n", "  operation_id: string | null\n  name: string\n", 'camera operation type')
          projects = replace_once(projects, "  organization_id: string | null\n  camera_id: string | null\n", "  operation_id: string | null\n  camera_id: string | null\n", 'job operation type')
          projects = replace_once(projects, "select('id,organization_id,name,address,status,created_at,updated_at')", "select('id,organization_id,operation_id,name,address,status,created_at,updated_at')", 'property select operation')
          projects = replace_once(projects, "select('id,organization_id,name,zone_label,active,is_demo')", "select('id,operation_id,name,zone_label,active,is_demo')", 'camera select operation')
          projects = replace_once(projects, "select('id,organization_id,camera_id,status,review_status,zone_label,captured_at,created_at,is_demo')", "select('id,operation_id,camera_id,status,review_status,zone_label,captured_at,created_at,is_demo')", 'job select operation')
          projects = projects.replace("wildlifeCamerasQuery = wildlifeCamerasQuery.eq('organization_id', emptyId)", "wildlifeCamerasQuery = wildlifeCamerasQuery.eq('operation_id', emptyId)")
          projects = projects.replace("wildlifeJobsQuery = wildlifeJobsQuery.eq('organization_id', emptyId)", "wildlifeJobsQuery = wildlifeJobsQuery.eq('operation_id', emptyId)")
          projects = replace_once(projects,
            "      wildlifeCamerasQuery = wildlifeCamerasQuery.in('organization_id', auth.user.organizationIds)\n      wildlifeJobsQuery = wildlifeJobsQuery.in('organization_id', auth.user.organizationIds)\n",
            "      if (auth.user.operationIds.length === 0) {\n        const emptyId = '00000000-0000-0000-0000-000000000000'\n        wildlifeCamerasQuery = wildlifeCamerasQuery.eq('operation_id', emptyId)\n        wildlifeJobsQuery = wildlifeJobsQuery.eq('operation_id', emptyId)\n      } else {\n        wildlifeCamerasQuery = wildlifeCamerasQuery.in('operation_id', auth.user.operationIds)\n        wildlifeJobsQuery = wildlifeJobsQuery.in('operation_id', auth.user.operationIds)\n      }\n",
            'nonadmin wildlife scope')
          projects = replace_once(projects,
            "            const orgWildlifeCameras = wildlifeCameras.filter((camera) => camera.organization_id === property.organization_id)\n            const orgWildlifeJobs = wildlifeJobs.filter((job) => job.organization_id === property.organization_id)\n",
            "            const orgWildlifeCameras = property.operation_id ? wildlifeCameras.filter((camera) => camera.operation_id === property.operation_id) : []\n            const orgWildlifeJobs = property.operation_id ? wildlifeJobs.filter((job) => job.operation_id === property.operation_id) : []\n",
            'property wildlife metrics scope')
          projects = replace_once(projects,
            "                        href={`/admin/vision?organizationId=${encodeURIComponent(property.organization_id)}`}\n",
            "                        href={property.operation_id ? `/admin/vision?operationId=${encodeURIComponent(property.operation_id)}` : '/admin/vision'}\n",
            'Vision navigation scope')
          projects_path.write_text(projects)

          vision_path = Path('app/admin/vision/page.tsx')
          vision = vision_path.read_text()
          vision = vision.replace("import Link from 'next/link'\n", "import Link from 'next/link'\nimport { redirect } from 'next/navigation'\n")
          vision = vision.replace("import { createSupabaseAdminClient } from '@/lib/supabase/admin'\n", "import { getCurrentAuthSession } from '@/lib/auth-store'\nimport { createSupabaseAdminClient } from '@/lib/supabase/admin'\n")
          vision = replace_once(vision, "  searchParams: Promise<{ organizationId?: string }>\n", "  searchParams: Promise<{ operationId?: string }>\n", 'vision query type')
          vision = replace_once(vision,
            "  const { organizationId } = await searchParams\n  const supabase = createSupabaseAdminClient()\n",
            "  const { operationId } = await searchParams\n  const auth = await getCurrentAuthSession()\n  if (!auth) redirect('/login?next=/admin/vision')\n  if (operationId && auth.user.role !== 'admin' && !auth.user.operationIds.includes(operationId)) redirect('/admin/proyectos')\n  const supabase = createSupabaseAdminClient()\n",
            'vision auth context')
          old_block = '''  if (organizationId && supabase) {\n    const [organizationResult, camerasResult, detectionsResult] = await Promise.all([\n      supabase.from('organizations').select('name').eq('id', organizationId).maybeSingle(),\n      supabase.from('wildlife_cameras').select('id', { count: 'exact', head: true }).eq('organization_id', organizationId),\n      supabase.from('wildlife_inference_jobs').select('id', { count: 'exact', head: true }).eq('organization_id', organizationId),\n    ])\n\n    organizationName = organizationResult.data?.name || null\n    cameraCount = camerasResult.count || 0\n    detectionCount = detectionsResult.count || 0\n  }\n'''
          new_block = '''  if (operationId && supabase) {\n    const { data: property } = await supabase\n      .from('properties')\n      .select('organization_id')\n      .eq('operation_id', operationId)\n      .maybeSingle()\n\n    if (property) {\n      const [organizationResult, camerasResult, detectionsResult] = await Promise.all([\n        supabase.from('organizations').select('name').eq('id', property.organization_id).maybeSingle(),\n        supabase.from('wildlife_cameras').select('id', { count: 'exact', head: true }).eq('operation_id', operationId),\n        supabase.from('wildlife_inference_jobs').select('id', { count: 'exact', head: true }).eq('operation_id', operationId),\n      ])\n\n      organizationName = organizationResult.data?.name || null\n      cameraCount = camerasResult.count || 0\n      detectionCount = detectionsResult.count || 0\n    }\n  }\n'''
          vision = replace_once(vision, old_block, new_block, 'vision counts')
          vision = vision.replace('{organizationId && (', '{operationId && (')
          vision = vision.replace('{organizationId && cameraCount === 0 && (', '{operationId && cameraCount === 0 && (')
          vision_path.write_text(vision)

          print('Operation-explicit Vision codemod complete')
          PY
      - name: Verify residual organization-first assumptions
        shell: bash
        run: |
          ! grep -R "organizationIds\[0\]" app/api/vision app/admin/vision app/admin/proyectos lib/api-auth.ts
          grep -n "x-operation-id" app/api/vision/openai/infer/route.ts
          grep -n "operation_id" app/api/vision/openai/infer/route.ts | head -20
          grep -n "operationId" app/admin/vision/page.tsx
      - name: Commit codemod
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/vision/openai/infer/route.ts app/admin/proyectos/page.tsx app/admin/vision/page.tsx
          git commit -m "refactor(vision): require explicit operation scope"
          git push origin HEAD:feature/huilo-huilo-wildlife-preservation
