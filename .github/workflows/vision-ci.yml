name: Vision CI

on:
  push:
    branches: [main]
    paths:
      - "vision/**"
      - ".github/workflows/vision-ci.yml"
  pull_request:
    paths:
      - "vision/**"
      - ".github/workflows/vision-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vision/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[vision,dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
