name: SegurIA Gateway Image

on:
  push:
    branches:
      - main
    paths:
      - gateway/**
      - .github/workflows/seguria-gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ghcr.io/traviscomber/seguria-gateway:latest
            ghcr.io/traviscomber/seguria-gateway:${{ github.sha }}
