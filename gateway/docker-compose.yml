services:
  seguria-gateway:
    build: .
    container_name: seguria-gateway
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    container_name: seguria-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto:/mosquitto/config
      - ./mosquitto-data:/mosquitto/data
      - ./mosquitto-log:/mosquitto/log
